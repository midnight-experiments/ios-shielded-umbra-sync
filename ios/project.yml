# The app's Xcode project, generated with XcodeGen: `xcodegen generate` in this folder writes PssSync.xcodeproj.
# Build the Rust core first (core/build.sh → core/build/PssCore.xcframework) and the Metal scan source
# (metal/gen-metal.ts → metal/generated/PssScan.metal).
name: PssSync
options:
  bundleIdPrefix: local.umbradb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PssSync:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Metal/**"]
      - path: metal/MetalScanner.swift
    # The Metal sources ship in the bundle as .msl text and are compiled when the app starts
    # (device.makeLibrary(source:)): this Xcode has no Metal Toolchain to compile .metal files at build time
    # (`xcodebuild -downloadComponent MetalToolchain` would add it).
    postCompileScripts:
      - name: Bundle the Metal sources
        script: |
          set -e
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dest"
          cp "$SRCROOT/App/Metal/Multiply.metal" "$dest/Multiply.msl"
          cp "$SRCROOT/metal/generated/PssScan.metal" "$dest/PssScan.msl"
          cp "$SRCROOT/metal/generated/PssScanW32.metal" "$dest/PssScanW32.msl"
        inputFiles:
          - $(SRCROOT)/App/Metal/Multiply.metal
          - $(SRCROOT)/metal/generated/PssScan.metal
          - $(SRCROOT)/metal/generated/PssScanW32.metal
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Multiply.msl
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PssScan.msl
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PssScanW32.msl
    dependencies:
      - framework: core/build/PssCore.xcframework
        embed: false
      - sdk: Security.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PSS Sync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to the private shielded sync server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.umbradb.pss-sync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # App/Assets.xcassets, drawn by icon/make-icon.swift
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OPTIMIZATION_LEVEL: -O
        MTL_FAST_MATH: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
